<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3a3a3f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drop Number" />
    <meta name="description" content="Solte, combine e multiplique blocos numerados. Puzzle 2048 com queda." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Drop Number</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="card" id="best-card">
          <span class="label"><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z"/></svg> Recorde</span>
          <span class="value" id="best">0</span>
        </div>
        <div class="card score-card">
          <span class="value big" id="score">0</span>
        </div>
        <div class="card" id="coins-card">
          <span class="label">Moedas</span>
          <span class="value"><i class="coin" aria-hidden="true"></i><span id="coins">0</span></span>
        </div>
      </header>

      <div class="next-row">
        <span class="next-label">Próximo bloco ▶</span>
        <div id="next" class="mini-tile">2</div>
      </div>

      <main id="board-wrap">
        <canvas id="board" aria-label="Tabuleiro do jogo"></canvas>
        <div id="hint" class="hint" role="status"></div>
      </main>

      <footer class="toolbar">
        <button id="btn-pause" class="btn square" aria-label="Pausar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
        <button id="btn-super" class="btn tool orange" aria-label="Super martelo: remove todos os blocos de um número">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="20" width="14" height="14" rx="3" fill="#7c4dff"/><text x="13" y="31" font-size="11" text-anchor="middle" fill="#fff" font-weight="900">?</text>
            <g transform="rotate(35 30 20)"><rect x="27" y="18" width="5" height="24" rx="2" fill="#e84a8a"/><rect x="19" y="8" width="22" height="13" rx="4" fill="#a17bd6"/><rect x="19" y="8" width="22" height="5" rx="3" fill="#c4a6ef"/></g>
          </svg>
          <span class="badge">3</span>
        </button>
        <button id="btn-hammer" class="btn tool green" aria-label="Martelo: remove um bloco">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <g transform="rotate(35 24 20)"><rect x="21" y="18" width="6" height="26" rx="2" fill="#e84a8a"/><rect x="11" y="6" width="26" height="15" rx="4" fill="#a17bd6"/><rect x="11" y="6" width="26" height="6" rx="3" fill="#c4a6ef"/></g>
          </svg>
          <span class="badge">3</span>
        </button>
        <button id="btn-sound" class="btn square" aria-label="Som" aria-pressed="false">
          <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </footer>

      <div id="pause-overlay" class="overlay">
        <div class="panel">
          <h2>Pausado</h2>
          <button id="btn-resume" class="btn wide green">Continuar</button>
          <button id="btn-restart" class="btn wide orange">Reiniciar</button>
        </div>
      </div>

      <div id="over-overlay" class="overlay">
        <div class="panel">
          <h2>Fim de jogo</h2>
          <div id="over-record" class="record">🏆 Novo recorde!</div>
          <div id="over-tile" class="mini-tile huge">2</div>
          <div class="stats">
            <div><span class="label">Pontuação</span><span class="value" id="over-score">0</span></div>
            <div><span class="label">Recorde</span><span class="value" id="over-best">0</span></div>
          </div>
          <button id="btn-again" class="btn wide green">Jogar de novo</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
